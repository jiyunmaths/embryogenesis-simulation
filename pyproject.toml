[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embryogenesis-simulation"
version = "0.1.0"
description = "A minimal three-dimensional deformable-cell embryogenesis model"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.6", "scikit-image>=0.25,<0.27"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
embryo = "embryo.__main__:main"
embryo-dashboard = "embryo.dashboard:main"

[tool.setuptools.package-data]
embryo = ["fast_mechanics.c", "fast_polarity.c", "native_mechanics.cpp", "cuda_mechanics.cu", "cuda_spatial_bench.cu", "gpu_kernels.cu", "viewer.html", "dashboard.html", "dashboard.css", "dashboard.js", "benchmark.js", "cell_surface.js"]

[tool.setuptools.packages.find]
include = ["embryo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
