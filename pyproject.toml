[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embryogenesis-simulation"
version = "0.1.0"
description = "A minimal three-dimensional deformable-cell embryogenesis model"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.6"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
embryo = "embryo.__main__:main"
embryo-dashboard = "embryo.dashboard:main"

[tool.setuptools.package-data]
embryo = ["viewer.html", "dashboard.html", "dashboard.css", "dashboard.js"]

[tool.setuptools.packages.find]
include = ["embryo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
